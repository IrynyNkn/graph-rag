server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # Upstreams are variables so that nginx asks Docker's DNS on each request. A name in proxy_pass
  # is resolved once at startup, and a restarted service would then answer with a 502 for good.
  resolver 127.0.0.11 valid=10s;

  location /api/indexing/ {
    set $indexing_service http://indexing-service:3001;
    rewrite ^/api/indexing/(.*)$ /$1 break;
    proxy_pass $indexing_service;
  }

  # Answers stream over SSE, and a local model can take minutes between events.
  location /api/assistant/ {
    set $assistant_service http://assistant-service:3002;
    rewrite ^/api/assistant/(.*)$ /$1 break;
    proxy_pass $assistant_service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
