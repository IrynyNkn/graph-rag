services:
  neo4j:
    image: neo4j:5
    container_name: graph-rag-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474)
      - "7687:7687" # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/graphrag-local
      # Stage 2: Personalized PageRank runs in the Graph Data Science plugin,
      # not in Cypher itself. This env var makes the official image download
      # and enable it at container startup (GDS Community Edition, no
      # separate license needed).
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
